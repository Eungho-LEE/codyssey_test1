services:
  web:
    build: ./web
    environment:
      APP_MODE: ${APP_MODE:-development}
      APP_PORT: ${APP_PORT:-8080}
      NGINX_ENVSUBST_FILTER: ^APP_
    ports:
      - "127.0.0.1:${HOST_PORT:-18081}:${APP_PORT:-8080}"
    depends_on:
      helper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$APP_PORT/"]
      interval: 2s
      timeout: 2s
      retries: 15
  helper:
    image: nginx:alpine
    volumes:
      - ./helper:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/status.json"]
      interval: 2s
      timeout: 2s
      retries: 15
